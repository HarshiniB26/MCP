name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ruff

      - name: Format check
        run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install build

      - name: Build
        run: python -m build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit and integration tests
        run: pytest

      - name: Evaluate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("results/eval_results.json").read_text())
          totals = data["summary"]
          decision = totals["decision_accuracy"]["score"]
          source = totals["escalation_source_accuracy"]["score"]
          reflection = totals["reflection_accuracy"]["score"]
          rows = data["cases"]
          assert decision == 1.0, totals["decision_accuracy"]
          assert source == 1.0, totals["escalation_source_accuracy"]
          assert reflection == 1.0, totals["reflection_accuracy"]
          assert len(rows) >= 8
          print(f"decision={decision:.3f} escalation_source={source:.3f} reflection={reflection:.3f} cases={len(rows)}")
          PY
